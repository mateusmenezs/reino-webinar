<script>
/* ============ RASTREAMENTO (UTM + Pixel + webhook) ============ */
(function(){
  var C = window.CONFIG;
  var KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','utm_id','fbclid','gclid'];
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function rid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
  function cookie(n){var m=document.cookie.match('(^|;)\\s*'+n+'=([^;]+)');return m?decodeURIComponent(m[2]):''}

  // UTMs: as da URL atual; se não houver, as últimas salvas neste navegador
  var qs = new URLSearchParams(location.search), saved = {}, utms = {};
  try{saved = JSON.parse(get('reino_utms')||'{}')}catch(e){}
  var temNova = KEYS.some(function(k){return qs.get(k)});
  KEYS.forEach(function(k){var v = temNova ? qs.get(k) : saved[k]; if(v) utms[k]=v});
  if(temNova) set('reino_utms', JSON.stringify(utms));
  var visitante = get('reino_vid'); if(!visitante){visitante = rid(); set('reino_vid', visitante)}

  // Textos da config
  document.querySelectorAll('[data-config]').forEach(function(el){var v=C[el.dataset.config]; if(v) el.textContent=v});

  // Meta Pixel
  var temPixel = /^\d{6,}$/.test(C.PIXEL_ID||'');
  if(temPixel){
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', C.PIXEL_ID);
    fbq('track', 'PageView');
  }

  function enviar(eventId){
    if(!C.WEBHOOK_URL) return;
    var fbc = cookie('_fbc') || (utms.fbclid ? 'fb.1.'+Date.now()+'.'+utms.fbclid : '');
    var dados = Object.assign({
      evento: C.EVENTO, pagina: C.PAGINA, acao: 'clique_grupo', event_id: eventId, visitante_id: visitante,
      fbp: cookie('_fbp'), fbc: fbc, url: location.href, referrer: document.referrer,
      user_agent: navigator.userAgent, data_hora: new Date().toISOString()
    }, utms);
    var corpo = new URLSearchParams(dados);
    var ok = false;
    try{ ok = navigator.sendBeacon && navigator.sendBeacon(C.WEBHOOK_URL, corpo) }catch(e){}
    if(!ok){ try{ fetch(C.WEBHOOK_URL,{method:'POST',body:corpo,mode:'no-cors',keepalive:true}) }catch(e){} }
  }

  var foi = false;
  window.irParaGrupo = function(espera){
    if(foi) return; foi = true;
    var eventId = 'lead_'+rid();
    if(temPixel) fbq('track','Lead',{content_name:C.EVENTO, content_category:C.PAGINA},{eventID:eventId});
    enviar(eventId);
    setTimeout(function(){ location.href = C.GROUP_URL }, espera||350);
  };

  // Redireciona assim que o Pixel carregar (máx. ~1,2 s no total)
  var fb = document.getElementById('fallback');
  fb.href = C.GROUP_URL;
  fb.addEventListener('click', function(){ if(!foi){ var id='lead_'+rid(); if(temPixel) fbq('track','Lead',{content_name:C.EVENTO,content_category:C.PAGINA},{eventID:id}); enviar(id); foi=true; } });
  setTimeout(function(){ document.body.classList.add('mostra-fallback') }, 3000);
  var inicio = Date.now();
  (function espera(){
    var pronto = !temPixel || (window.fbq && window.fbq.callMethod);
    if(pronto || Date.now()-inicio > 900) window.irParaGrupo(pronto && temPixel ? 300 : 100);
    else setTimeout(espera, 100);
  })();
})();
</script>
